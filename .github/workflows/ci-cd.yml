name: AURONTEK CI/CD

on:
  push:
    branches: [main, test, dev]
  pull_request:
    branches: [main, test]

permissions:
  contents: read

env:
  REGISTRY: docker.io
  AWS_REGION: us-east-1

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check --no-cache-dir semgrep
      - name: Semgrep SAST
        run: semgrep scan --config p/ci --error --exclude node_modules
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit Node services
        shell: bash
        run: |
          set -euo pipefail
          for service in gateway-svc usuarios-svc tickets-svc chat-svc notificaciones-svc; do
            npm --prefix "backend/${service}" ci --ignore-scripts
            npm --prefix "backend/${service}" audit --audit-level=high
          done
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.edge.yml config --quiet
          docker compose -f docker-compose.core.yml config --quiet

  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: security-gate
    strategy:
      matrix:
        service: [gateway-svc, usuarios-svc, tickets-svc, chat-svc, notificaciones-svc, ia-svc]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        run: docker build --pull -t aurontek-${{ matrix.service }}:${{ github.sha }} ./backend/${{ matrix.service }}

  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [gateway-svc, usuarios-svc, tickets-svc, chat-svc, notificaciones-svc, ia-svc]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ matrix.service }}
          load: true
          push: false
          tags: ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}-${{ github.sha }}.spdx.json
      - name: Push immutable image
        run: docker push "${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }}"
      - name: Push latest tag
        run: |
          docker tag "${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }}" "${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:latest"

  deploy-edge:
    name: Deploy EDGE via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_AURONTEK_DEPLOY_ROLE_ARN }}
          role-session-name: aurontek-edge-deploy
          role-duration-seconds: 900
      - name: Deploy EDGE with SSM Run Command
        env:
          INSTANCE_ID: ${{ secrets.AURONTEK_EDGE_INSTANCE_ID }}
          SECRET_ARN: ${{ secrets.AURONTEK_EDGE_SECRET_ARN }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          COMPOSE_URL: https://raw.githubusercontent.com/ezelpc/AURONTEK/${{ github.sha }}/docker-compose.edge.yml
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/deploy-edge.sh <<EOF
          set -euo pipefail
          install -d -m 700 /opt/aurontek
          curl --fail --silent --show-error --location '${COMPOSE_URL}' -o /opt/aurontek/docker-compose.edge.yml
          umask 077
          aws secretsmanager get-secret-value --secret-id '${SECRET_ARN}' --query SecretString --output text | jq -r '.env' > /opt/aurontek/.env
          printf '%s\\n' 'IMAGE_TAG=${IMAGE_TAG}' >> /opt/aurontek/.env
          printf '%s\\n' 'DOCKER_USERNAME=${DOCKER_USERNAME}' >> /opt/aurontek/.env
          docker compose -f /opt/aurontek/docker-compose.edge.yml config --quiet
          docker compose -f /opt/aurontek/docker-compose.edge.yml pull
          docker compose -f /opt/aurontek/docker-compose.edge.yml up -d --force-recreate --remove-orphans
          docker image prune -f
          docker compose -f /opt/aurontek/docker-compose.edge.yml ps
          EOF
          PARAMS=$(jq -R -s -c '{commands: split("\\n") | map(select(length > 0))}' /tmp/deploy-edge.sh)
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$PARAMS" \
            --comment "AURONTEK EDGE ${IMAGE_TAG}" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --details --query 'CommandInvocations[0].Status' --output text)
          test "$STATUS" = "Success"

  deploy-core:
    name: Deploy CORE via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_AURONTEK_DEPLOY_ROLE_ARN }}
          role-session-name: aurontek-core-deploy
          role-duration-seconds: 900
      - name: Deploy CORE with SSM Run Command
        env:
          INSTANCE_ID: ${{ secrets.AURONTEK_CORE_INSTANCE_ID }}
          SECRET_ARN: ${{ secrets.AURONTEK_CORE_SECRET_ARN }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          COMPOSE_URL: https://raw.githubusercontent.com/ezelpc/AURONTEK/${{ github.sha }}/docker-compose.core.yml
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/deploy-core.sh <<EOF
          set -euo pipefail
          install -d -m 700 /opt/aurontek
          curl --fail --silent --show-error --location '${COMPOSE_URL}' -o /opt/aurontek/docker-compose.core.yml
          umask 077
          aws secretsmanager get-secret-value --secret-id '${SECRET_ARN}' --query SecretString --output text | jq -r '.env' > /opt/aurontek/.env
          printf '%s\\n' 'IMAGE_TAG=${IMAGE_TAG}' >> /opt/aurontek/.env
          printf '%s\\n' 'DOCKER_USERNAME=${DOCKER_USERNAME}' >> /opt/aurontek/.env
          docker compose -f /opt/aurontek/docker-compose.core.yml config --quiet
          docker compose -f /opt/aurontek/docker-compose.core.yml pull
          docker compose -f /opt/aurontek/docker-compose.core.yml up -d --force-recreate --remove-orphans
          docker image prune -f
          docker compose -f /opt/aurontek/docker-compose.core.yml ps
          EOF
          PARAMS=$(jq -R -s -c '{commands: split("\\n") | map(select(length > 0))}' /tmp/deploy-core.sh)
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$PARAMS" \
            --comment "AURONTEK CORE ${IMAGE_TAG}" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --details --query 'CommandInvocations[0].Status' --output text)
          test "$STATUS" = "Success"
