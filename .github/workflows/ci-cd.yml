name: CI/CD Pipeline - Dual EC2

on:
  push:
    branches: [main, test, dev]
  pull_request:
    branches: [main, test]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  REGISTRY: docker.io

jobs:
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Semgrep SAST
        run: semgrep scan --config p/ci --error --exclude node_modules

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: npm audit - all Node services
        shell: bash
        run: |
          set -euo pipefail
          for service in gateway-svc usuarios-svc tickets-svc chat-svc notificaciones-svc; do
            echo "Auditing backend/${service}"
            npm --prefix "backend/${service}" ci --ignore-scripts
            npm --prefix "backend/${service}" audit --audit-level=high
          done

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Docker Compose configuration validation
        run: |
          docker compose -f docker-compose.edge.yml config --quiet
          docker compose -f docker-compose.core.yml config --quiet

  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: security-gate
    strategy:
      matrix:
        service: [gateway-svc, usuarios-svc, tickets-svc, chat-svc, notificaciones-svc, ia-svc]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        run: docker build -t aurontek-${{ matrix.service }}:${{ github.sha }} ./backend/${{ matrix.service }}
      - name: All services built successfully
        if: success()
        run: echo "All Docker images built successfully for branch ${{ github.ref_name }}"

  build-and-push:
    name: Build, Scan & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [gateway-svc, usuarios-svc, tickets-svc, chat-svc, notificaciones-svc, ia-svc]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image for security validation
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          load: true
          push: false
          no-cache: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }}
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}-${{ github.sha }}.spdx.json
      - name: Push immutable image tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }}
      - name: Push latest image tag
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/aurontek-${{ matrix.service }}:latest

  deploy-to-edge:
    name: Deploy to EDGE (Public EC2)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Copy docker-compose.edge.yml to EDGE
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EDGE_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.edge.yml
          target: /opt/aurontek
      - name: Deploy to EDGE
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EDGE_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/aurontek
            umask 077
            cat > .env <<EOF
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            IMAGE_TAG=${{ github.sha }}
            CORE_PRIVATE_IP=${{ secrets.CORE_PRIVATE_IP }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            CUSTOM_DOMAIN=${{ secrets.CUSTOM_DOMAIN }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SERVICE_TOKEN=${{ secrets.SERVICE_TOKEN }}
            RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}
            RECAPTCHA_TEST_TOKEN=${{ secrets.RECAPTCHA_TEST_TOKEN }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            EOF
            docker compose -f docker-compose.edge.yml pull
            docker compose -f docker-compose.edge.yml up -d --force-recreate --remove-orphans
            docker image prune -af
            echo "EDGE deployment complete"
            docker ps
            free -h
      - name: EDGE deployment successful
        run: echo "EDGE instance deployed successfully!"

  deploy-to-core:
    name: Deploy to CORE (Private EC2)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Copy docker-compose.core.yml to EDGE
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EDGE_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.core.yml
          target: /tmp
      - name: Deploy to CORE via EDGE
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EDGE_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            umask 077
            mkdir -p ~/.ssh
            echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            scp -o StrictHostKeyChecking=no /tmp/docker-compose.core.yml ubuntu@${{ secrets.CORE_PRIVATE_IP }}:/opt/aurontek/
            ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.CORE_PRIVATE_IP }} << 'ENDSSH'
            set -e
            cd /opt/aurontek
            umask 077
            cat > .env <<EOF
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            IMAGE_TAG=${{ github.sha }}
            EDGE_PRIVATE_IP=${{ secrets.EDGE_PRIVATE_IP }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SERVICE_TOKEN=${{ secrets.SERVICE_TOKEN }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            EOF
            docker compose -f docker-compose.core.yml pull
            docker compose -f docker-compose.core.yml up -d --force-recreate --remove-orphans
            docker image prune -af
            echo "CORE deployment complete"
            docker ps
            free -h
            ENDSSH
      - name: CORE deployment successful
        run: echo "CORE instance deployed successfully!"
